<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #444;
            overflow: hidden;
        }

        /* ENTRY */
        .entry {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            text-align: center;
        }

        .entry button {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
        }

        /* MAIN */
        .container {
            display: none;
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 25px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .title {
            font-size: clamp(30px, 6vw, 50px);
            color: #ff4d6d;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #666;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
        }

        .message {
            margin-top: 15px;
            font-size: 18px;
            min-height: 60px;
        }

        /* BUTTON */
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.15s;
        }

        /* 🔥 CLICK EFFECT */
        .btn:active {
            transform: scale(0.92);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2) inset;
        }

        /* GAME DESCRIPTION */
        .game-desc {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }

        /* POPUP */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
        }

        .popup.active {
            visibility: visible;
            opacity: 1;
        }

        .popup-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        /* FLOAT HEARTS */
        .heart {
            position: absolute;
            bottom: -20px;
            color: #ff4d6d;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            100% {
                transform: translateY(-100vh);
            }
        }

        /* BURST */
        .burst {
            position: absolute;
            animation: burst 1s forwards;
        }

        @keyframes burst {
            to {
                transform: translate(var(--x), var(--y));
                opacity: 0;
            }
        }

        /* SPARKLES */
        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: fadeOut 1s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        /* TAP GAME */
        .tap-heart {
            position: absolute;
            font-size: 30px;
            cursor: pointer;
            animation: pop 0.3s;
        }

        @keyframes pop {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        /* FADE */
        .fade {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="entry" id="entry">
        <h1>💌 Tap to Open Surprise</h1>
        <button onclick="enterSite()">Open ❤️</button>
    </div>

    <div class="container" id="main">

        <h1 class="title fade" style="animation-delay:0.3s;">Happy Anniversary ❤️</h1>

        <p class="subtitle fade" style="animation-delay:0.6s;">Mama & Mami 💖</p>

        <div class="gallery fade" style="animation-delay:0.9s;">
            <img src="img1.jpeg">
            <img src="img2.jpeg">
            <img src="img3.jpeg">
        </div>

        <p class="message fade" style="animation-delay:1.2s;" id="typeText"></p>

        <button class="btn fade" style="animation-delay:1.5s;" onclick="openPopup()">Open Message 💌</button>

        <!-- GAME -->
        <button class="btn fade" style="animation-delay:1.8s;" onclick="startGame()">Tap Hearts 💖</button>

        <p class="game-desc fade" style="animation-delay:2s;">
            Tap hearts quickly to unlock a sweet surprise 💖
        </p>

        <div id="gameArea" class="fade" style="animation-delay:2.2s; position:relative;height:200px;"></div>

    </div>

    <!-- POPUP -->
    <div class="popup" id="popup">
        <div class="popup-box">
            <h2>💖 For You 💖</h2>
            <p>Your love is beautiful ❤️ Stay blessed forever ✨</p>
            <br>
            <button class="btn" onclick="closePopup()">Close</button>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3">
    </audio>

    <script>

        /* ENTRY */
        function enterSite() {
            document.getElementById("bgMusic").play().catch(() => { });
            document.getElementById("entry").style.display = "none";

            let main = document.getElementById("main");
            main.style.display = "block";

            /* trigger fade */
            document.querySelectorAll(".fade").forEach(el => {
                el.style.animation = "none";
                el.offsetHeight;
                el.style.animation = "";
            });

            startTyping();
        }

        /* TYPEWRITER */
        let msg = "Your love is a beautiful journey filled with endless memories ❤️";
        let i = 0;
        function startTyping() {
            let el = document.getElementById("typeText");
            let int = setInterval(() => {
                el.innerHTML += msg[i];
                i++;
                if (i >= msg.length) clearInterval(int);
            }, 40);
        }

        /* POPUP */
        function openPopup() { document.getElementById("popup").classList.add("active"); }
        function closePopup() { document.getElementById("popup").classList.remove("active"); }

        /* HEARTS */
        setInterval(() => {
            let h = document.createElement("div");
            h.className = "heart"; h.innerHTML = "❤";
            h.style.left = Math.random() * 100 + "vw";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 500);

        /* BURST */
        document.addEventListener("click", (e) => {
            for (let i = 0; i < 6; i++) {
                let b = document.createElement("div");
                b.className = "burst"; b.innerHTML = "💖";
                b.style.left = e.clientX + "px"; b.style.top = e.clientY + "px";
                b.style.setProperty("--x", (Math.random() - 0.5) * 100 + "px");
                b.style.setProperty("--y", (Math.random() - 0.5) * 100 + "px");
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 1000);
            }
        });

        /* SPARKLES */
        document.addEventListener("mousemove", (e) => {
            let s = document.createElement("div");
            s.className = "sparkle"; s.innerHTML = "✨";
            s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px";
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 1000);
        });

        /* GAME */
        let score = 0, interval;

        function startGame() {
            let area = document.getElementById("gameArea");
            area.innerHTML = "";
            score = 0;

            interval = setInterval(spawnHeart, 1000);

            setTimeout(() => {
                if (score < 5) {
                    area.innerHTML = "😄 Try again!";
                    clearInterval(interval);
                }
            }, 30000);
        }

        function spawnHeart() {
            let area = document.getElementById("gameArea");

            let h = document.createElement("div");
            h.className = "tap-heart";
            h.innerHTML = "💖";

            h.style.left = Math.random() * 80 + "%";
            h.style.top = Math.random() * 80 + "%";

            h.onclick = () => {
                h.remove();
                score++;
                if (score >= 3) {
                    clearInterval(interval);
                    area.innerHTML = "🎉 So much love! Just like MY Mama & Mami ❤️";
                }
            };

            area.appendChild(h);
            setTimeout(() => h.remove(), 2200);
        }

    </script>

</body>

</html>
